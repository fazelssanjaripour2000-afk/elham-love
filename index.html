<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>...</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 48%, #171717 0%, #090909 42%, #020202 100%);
      color: #f2f2f2;
      font-family: Tahoma, Arial, sans-serif;
    }
    .scene {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      isolation: isolate;
    }
    .glow {
      position: absolute;
      width: min(72vw, 560px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #242424;
      filter: blur(100px);
      opacity: .22;
      z-index: -1;
    }
    .message {
      position: relative;
      z-index: 2;
      padding: 28px;
      text-align: center;
      font-size: clamp(2rem, 7vw, 5.2rem);
      font-weight: 500;
      letter-spacing: .04em;
      color: #f5f5f5;
      text-shadow: 0 0 18px #ffffff18, 0 0 45px #ffffff12;
      animation: appear 2.2s ease both;
    }
    .heart {
      position: absolute;
      bottom: -12vh;
      color: #000;
      -webkit-text-stroke: 1px #292929;
      text-shadow: 0 0 16px #ffffff12;
      opacity: 0;
      user-select: none;
      pointer-events: none;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translate3d(0, 0, 0) rotate(-12deg) scale(.7); opacity: 0; }
      12%  { opacity: .95; }
      85%  { opacity: .7; }
      100% { transform: translate3d(var(--drift), -120vh, 0) rotate(22deg) scale(1.15); opacity: 0; }
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(18px); filter: blur(8px); }
      to   { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="صفحه‌ای با قلب‌های مشکی">
    <div class="glow"></div>
    <div class="message">انا لنا ....</div>
  </main>
  <script>
    const scene = document.querySelector('.scene');
    const heartCount = 34;

    for (let i = 0; i < heartCount; i++) {
      const heart = document.createElement('span');
      heart.className = 'heart';
      heart.textContent = '♥';
      heart.style.left = `${Math.random() * 100}%`;
      heart.style.fontSize = `${14 + Math.random() * 34}px`;
      heart.style.animationDuration = `${9 + Math.random() * 13}s`;
      heart.style.animationDelay = `${-Math.random() * 22}s`;
      heart.style.setProperty('--drift', `${-70 + Math.random() * 140}px`);
      scene.appendChild(heart);
    }
  </script>
</body>
</html>
