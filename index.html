
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#160817">
<title>دردونه کوشولوی فاضل ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff5d9e;--rose:#ffb4d1;--text:#fff7fb}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;width:100%}
body{font-family:Vazirmatn,Tahoma,sans-serif;color:var(--text);overflow:hidden;min-height:100svh;background:radial-gradient(900px 600px at 12% 8%,rgba(255,48,145,.2),transparent 60%),radial-gradient(800px 600px at 88% 18%,rgba(126,72,255,.2),transparent 60%),linear-gradient(135deg,#050208,#100415 48%,#18061f 70%,#050208);display:grid;place-items:center;text-align:center}
body:before{content:"";position:fixed;inset:-20%;pointer-events:none;background:conic-gradient(from 30deg at 20% 25%,transparent 0 20%,rgba(255,65,153,.08) 27%,transparent 36% 62%,rgba(155,91,255,.07) 70%,transparent 80%);filter:blur(40px);animation:aurora 22s ease-in-out infinite alternate}
body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.3;background-image:radial-gradient(circle at 20% 30%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 70% 65%,rgba(255,188,225,.8) 0 1px,transparent 1.5px);background-size:190px 170px,240px 210px}
@keyframes aurora{to{transform:translate3d(3%,3%,0) scale(1.05)}}
main{position:relative;z-index:1;width:100%;min-height:100svh;display:grid;place-items:center;padding:28px 18px}
.hero-content{width:min(900px,100%);padding:26px 10px}
.kicker{color:var(--rose);letter-spacing:2px;font-size:clamp(10px,2vw,13px);margin-bottom:18px}
h1{font-size:clamp(34px,8vw,78px);line-height:1.35;text-shadow:0 0 40px rgba(255,91,158,.28);font-weight:800}
h1 span{color:var(--pink);white-space:nowrap}
.subtitle{font-size:clamp(16px,3vw,24px);color:#f4dce7;margin:22px 0 12px;animation:fade 3.5s ease-in-out infinite}
@keyframes fade{0%,100%{opacity:.6;transform:translateY(3px)}50%{opacity:1;transform:none}}
.heart-wrap{width:210px;height:200px;margin:22px auto 10px;position:relative;filter:drop-shadow(0 15px 18px rgba(0,0,0,.4)) drop-shadow(0 0 28px rgba(255,45,135,.55));animation:float 4.5s ease-in-out infinite;pointer-events:none}
.heart-wrap:before{content:"";position:absolute;width:190px;height:190px;left:10px;top:3px;border-radius:50%;background:radial-gradient(circle,rgba(255,110,180,.34),rgba(255,65,150,.12) 40%,transparent 72%);filter:blur(16px)}
.heart{position:absolute;left:28px;top:13px;width:154px;height:154px;background:radial-gradient(circle at 31% 19%,rgba(255,255,255,.95) 0 3%,transparent 12%),linear-gradient(145deg,#ffd8e8,#ff9cc5 14%,#ff4b95 36%,#ec216f 58%,#a80c4f 79%,#65062f);clip-path:polygon(50% 96%,42% 87%,31% 77%,20% 66%,10% 53%,5% 42%,6% 30%,12% 20%,21% 13%,31% 10%,40% 13%,47% 20%,50% 27%,53% 20%,60% 13%,69% 10%,79% 13%,88% 20%,94% 30%,95% 42%,90% 53%,80% 66%,69% 77%,58% 87%);box-shadow:inset 15px 10px 22px rgba(255,255,255,.34),inset -18px -25px 35px rgba(67,0,31,.46)}
.shine{position:absolute;z-index:2;top:37px;left:57px;width:55px;height:24px;border-radius:100%;background:linear-gradient(105deg,rgba(255,255,255,.95),rgba(255,255,255,.4) 38%,transparent 78%);filter:blur(.7px);transform:rotate(-35deg);animation:shine 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}
@keyframes shine{50%{transform:translateX(13px) translateY(4px) rotate(-28deg);opacity:1}}
.bottom-note{color:rgba(255,220,235,.75);font-size:13px;margin-top:14px}
@media(max-width:480px){.hero-content{padding:20px 5px}.heart-wrap{transform:scale(.88);margin:12px auto 0}.bottom-note{font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style>
</head>
<body>
<main>
<section class="hero-content" aria-label="صفحه اصلی">
<div class="kicker">A LITTLE WORLD MADE FOR TWO ❤️</div>
<h1>دردونه کوشولوی <span>فاضل ❤️</span></h1>
<p class="subtitle">تو قشنگ‌ترین اتفاق زندگی منی 🥹</p>
<div class="heart-wrap" aria-hidden="true"><div class="heart"></div><div class="shine"></div></div>
<div class="bottom-note">فقط یه گوشه‌ی کوچیک از عشق من به تو ❤️</div>
</section>
</main>
</body>
</html>
